name: Notebook checks

on:
  pull_request:
    paths:
      - "notebooks/**"
      - "scripts/chapters.json"
      - "content/**"
      - ".env.example"
      - ".github/workflows/notebooks.yml"
  push:
    branches: [main]
    paths: ["notebooks/**", ".github/workflows/notebooks.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COURSE_MODE: offline
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.10.2
      - name: Install locked environment
        run: uv sync --project notebooks --locked --extra server
      - name: Test execution contracts
        run: uv run --project notebooks --locked --extra server pytest notebooks/tests
      - name: Validate notebooks and links
        run: uv run --project notebooks --locked --extra server python -m course_notebooks.run --check-only
      - name: Check committed HTML and Markdown copies
        run: uv run --project notebooks --locked --extra server python -m course_notebooks.run --check-reading
      - name: Execute in isolated kernels and export
        run: uv run --project notebooks --locked --extra server python -m course_notebooks.run
      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-results
          path: artifacts/notebooks/
          if-no-files-found: ignore
