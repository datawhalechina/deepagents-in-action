[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "deepagents-course-notebooks"
version = "0.1.0"
description = "Reproducible mechanism experiments for Deep Agents in Action"
requires-python = ">=3.12,<3.13"
dependencies = [
  "deepagents==0.7.22", "langchain==1.4.3", "langgraph==1.2.13",
  "langchain-core==1.6.6", "langchain-openai==1.6.7", "python-dotenv>=1.2.4,<2",
  "ipykernel>=7.4,<8", "nbclient>=0.11,<0.12", "nbconvert==7.17.1",
  "nbformat>=5.11.1,<6",
]

[project.optional-dependencies]
server = [
  "langgraph-cli[inmem]==0.4.32", "langgraph-sdk==0.4.5",
  "langgraph-api==0.15.1", "langgraph-runtime-inmem==0.35.1",
]
search = ["tavily-python==0.8.4"]

[dependency-groups]
dev = ["pytest>=9.1.1,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/course_notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
